name: Feature request
description: Suggest a new method or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the client makes hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

name: CI

# On pull requests, only checks that a change needs are run: build and test
# jobs are skipped when only docs change, and dependency review runs only when
# dependencies change. "CI passed" summarises the CI jobs; the main ruleset also
# requires the CodeRabbit review.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "deps=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh pr diff "$PR" --name-only)
          echo "$files"
          docs='^(docs/|examples/README|LICENSE$|.*\.md$|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$)'
          if echo "$files" | grep -qvE "$docs"; then code=true; else code=false; fi
          if echo "$files" | grep -qE '^(package\.json|pnpm-lock\.yaml)$'; then deps=true; else deps=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint, format & typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  package:
    name: Build & validate package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:package
      - name: Smoke-test the packed tarball
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null
          npm install ./*.tgz
          node -e "const c = require('@jowinjohnchemban/hashnode-client'); if (typeof c.HashnodeClient !== 'function') process.exit(1)"
          node --input-type=module -e "import { createWebhookHandler } from '@jowinjohnchemban/hashnode-client/webhooks'; if (typeof createWebhookHandler !== 'function') process.exit(1)"
          node --input-type=module -e "import { createMcpServer } from '@jowinjohnchemban/hashnode-client/mcp'; if (typeof createMcpServer !== 'function') process.exit(1)"
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | npx --no-install hashnode-mcp --host example.com | grep -q '"get_post"'

  security:
    name: Security checks
    # Runs on every change, including docs: invisible characters can hide anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, quality, test, package, security, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

name: Release

# Every push to main is verified, then semantic-release decides from the commit
# messages whether to release. If so, it publishes to npm (trusted publishing
# with provenance), tags vX.Y.Z and creates a GitHub release. Nothing else can
# release: the npm environment only accepts deployments from main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@jowinjohnchemban/hashnode-client
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
